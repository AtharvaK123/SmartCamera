<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E5C9D7">
  <title>SmartCam</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app" data-tab="home">
    <header class="topbar">
      <span class="brand">Smart<b>Cam</b></span>
      <h1 class="page-title" id="pageTitle">Today</h1>
      <button class="icon-btn" id="openSettings" aria-label="Settings"></button>
    </header>

    <nav class="nav" id="nav" aria-label="Sections">
      <span class="brand nav-brand">Smart<b>Cam</b></span>
      <div class="nav-items" id="navItems"></div>
      <button class="nav-item nav-settings" id="openSettings2"></button>
    </nav>

    <main class="view" id="view" tabindex="-1"></main>

    <button class="ask" id="askBar" type="button">
      <span>Ask Gemini</span>
      <span class="gmark">G</span>
    </button>

    <aside class="chat" id="chat" aria-label="Gemini assistant"></aside>
    <div class="chat-backdrop" id="chatBackdrop"></div>
  </div>

  <div id="sheetRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/native.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/services.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/games/common.js"></script>
  <script src="js/games/tetris.js"></script>
  <script src="js/games/jigsaw.js"></script>
  <script src="js/games/meditation.js"></script>
  <script src="js/views/camera.js"></script>
  <script src="js/views/food.js"></script>
  <script src="js/views/phone.js"></script>
  <script src="js/views/shop.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
